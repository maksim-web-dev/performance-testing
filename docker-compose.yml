networks:
  performance:
    driver: bridge

services:
  k6:
    image: grafana/k6:latest
    entrypoint: ["k6"]
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: "0.0.0.0"
      K6_WEB_DASHBOARD_PERIOD: "2s"
      K6_WEB_DASHBOARD_EXPORT: "/work/results/report.html"
    ports:
      - "5665:5665"
    networks:
      - performance
